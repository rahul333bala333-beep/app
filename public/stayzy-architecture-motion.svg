<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052E19" />
      <stop offset="100%" stop-color="#021B0E" />
    </linearGradient>

    <!-- Node Card Gradients -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D5A32" />
      <stop offset="100%" stop-color="#073B20" />
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14693B" />
      <stop offset="100%" stop-color="#094023" />
    </linearGradient>

    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E7B46" />
      <stop offset="100%" stop-color="#0C4E2A" />
    </linearGradient>

    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseBeam {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .flow-line {
      stroke: #D9F58B;
      stroke-width: 2.5;
      stroke-dasharray: 8 16;
      animation: pulseBeam 2s linear infinite;
    }
    .flow-line-reverse {
      stroke: #34D399;
      stroke-width: 2;
      stroke-dasharray: 6 14;
      animation: pulseBeam 2.5s linear infinite reverse;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      fill: #FFFFFF;
    }
    .text-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      fill: #A3CFBB;
    }
    .text-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      fill: #D9F58B;
      font-size: 10px;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1000" height="480" rx="20" fill="url(#archBg)" stroke="#0E5830" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" font-size="22" class="text-title">STAYZY Unified Architecture &amp; Data Pipeline</text>
    <text x="0" y="20" font-size="12" class="text-sub">Three isolated role interfaces coordinated through Next.js Edge Middleware and unified Prisma ORM data tier</text>
  </g>

  <!-- =========================================================================
       COLUMN 1: ROLE CLIENT PORTALS (Left: x=60)
  ========================================================================= -->
  <!-- Client 1: Customer -->
  <g transform="translate(60, 90)">
    <rect width="220" height="85" rx="14" fill="url(#clientGrad)" stroke="#167442" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#D9F58B" />
    <text x="28" y="33" font-size="12" font-weight="900" fill="#07552D" text-anchor="middle">C</text>
    <text x="52" y="26" font-size="14" class="text-title">Customer Web/Mobile</text>
    <text x="52" y="42" font-size="10" class="text-sub">Next.js App Router (/customer)</text>
    <text x="16" y="66" class="text-code">SMS OTP • Google OAuth • UPI</text>
  </g>

  <!-- Client 2: PG Owner -->
  <g transform="translate(60, 205)">
    <rect width="220" height="85" rx="14" fill="url(#clientGrad)" stroke="#167442" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#D9F58B" />
    <text x="28" y="33" font-size="12" font-weight="900" fill="#07552D" text-anchor="middle">O</text>
    <text x="52" y="26" font-size="14" class="text-title">PG Owner Portal</text>
    <text x="52" y="42" font-size="10" class="text-sub">SaaS Management (/owner)</text>
    <text x="16" y="66" class="text-code">Inventory • Residents • Payouts</text>
  </g>

  <!-- Client 3: Admin Staff -->
  <g transform="translate(60, 320)">
    <rect width="220" height="85" rx="14" fill="url(#clientGrad)" stroke="#167442" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#D9F58B" />
    <text x="28" y="33" font-size="12" font-weight="900" fill="#07552D" text-anchor="middle">A</text>
    <text x="52" y="26" font-size="14" class="text-title">Admin Command</text>
    <text x="52" y="42" font-size="10" class="text-sub">Operations Center (/admin)</text>
    <text x="16" y="66" class="text-code">KYC • Refunds • Audit Logs</text>
  </g>

  <!-- =========================================================================
       ANIMATED CONNECTORS (Col 1 to Col 2)
  ========================================================================= -->
  <path d="M 280 132 C 340 132, 340 220, 390 220" fill="none" class="flow-line" />
  <path d="M 280 247 L 390 247" fill="none" class="flow-line" />
  <path d="M 280 362 C 340 362, 340 274, 390 274" fill="none" class="flow-line" />

  <!-- =========================================================================
       COLUMN 2: EDGE GATEWAY & SECURITY (Center: x=390)
  ========================================================================= -->
  <g transform="translate(390, 140)">
    <rect width="240" height="215" rx="18" fill="url(#coreGrad)" stroke="#22C55E" stroke-width="2" filter="url(#nodeGlow)" />
    <!-- Header -->
    <rect x="0" y="0" width="240" height="42" rx="18" fill="#073B20" />
    <text x="120" y="26" font-size="13" class="text-title" text-anchor="middle">Next.js Edge Middleware</text>

    <!-- Content Items -->
    <g transform="translate(16, 58)">
      <circle cx="6" cy="6" r="3" fill="#D9F58B" />
      <text x="16" y="10" font-size="11" class="text-title">Role-Based Route Guards</text>
      <text x="16" y="24" font-size="9" class="text-sub">Isolates /admin, /owner &amp; /customer</text>

      <circle cx="6" cy="46" r="3" fill="#D9F58B" />
      <text x="16" y="50" font-size="11" class="text-title">Session Validation &amp; Token TTL</text>
      <text x="16" y="64" font-size="9" class="text-sub">JWT HS256 + HttpOnly Cookie</text>

      <circle cx="6" cy="86" r="3" fill="#D9F58B" />
      <text x="16" y="90" font-size="11" class="text-title">Zero-Cache Back Button Defense</text>
      <text x="16" y="104" font-size="9" class="text-sub">Cache-Control: no-store, no-cache</text>

      <circle cx="6" cy="126" r="3" fill="#D9F58B" />
      <text x="16" y="130" font-size="11" class="text-title">In-App Logout Revocation</text>
      <text x="16" y="144" font-size="9" class="text-sub">Immediate Session DB Deletion</text>
    </g>
  </g>

  <!-- =========================================================================
       ANIMATED CONNECTORS (Col 2 to Col 3)
  ========================================================================= -->
  <path d="M 630 220 L 720 220" fill="none" class="flow-line" />
  <path d="M 720 274 L 630 274" fill="none" class="flow-line-reverse" />

  <!-- =========================================================================
       COLUMN 3: CENTRALIZED API & PRISMA DATA TIER (Right: x=720)
  ========================================================================= -->
  <!-- API Engine Box -->
  <g transform="translate(720, 90)">
    <rect width="220" height="150" rx="16" fill="url(#dataGrad)" stroke="#167442" stroke-width="1.5" />
    <text x="16" y="28" font-size="13" class="text-title">Centralized REST API</text>
    <text x="16" y="44" font-size="10" class="text-sub">Next.js 14 Route Handlers</text>

    <g transform="translate(16, 56)">
      <text x="0" y="14" class="text-code">• /api/auth (OTP, Google, Logout)</text>
      <text x="0" y="32" class="text-code">• /api/bookings (Atomic Bed Lock)</text>
      <text x="0" y="50" class="text-code">• /api/properties &amp; /api/beds</text>
      <text x="0" y="68" class="text-code">• /api/payments &amp; /api/refunds</text>
    </g>
  </g>

  <!-- Database Box -->
  <g transform="translate(720, 260)">
    <rect width="220" height="145" rx="16" fill="url(#dataGrad)" stroke="#D9F58B" stroke-width="1.5" />
    <text x="16" y="28" font-size="13" class="text-title">Unified Database Tier</text>
    <text x="16" y="44" font-size="10" class="text-sub">Prisma ORM • Shared Schema</text>

    <g transform="translate(16, 56)">
      <text x="0" y="14" class="text-code">User, Session, Account, OTP</text>
      <text x="0" y="30" class="text-code">Property, Room, Bed, Booking</text>
      <text x="0" y="46" class="text-code">Payment, Refund, AuditLog</text>
      <text x="0" y="62" class="text-code">Visit, SupportTicket, Payout</text>
    </g>
  </g>

  <!-- Flow connector between API and DB -->
  <path d="M 830 240 L 830 260" stroke="#D9F58B" stroke-width="2" stroke-dasharray="3 3" />
</svg>
